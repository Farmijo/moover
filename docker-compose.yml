version: "3.9"

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: moover
      POSTGRES_PASSWORD: password
      POSTGRES_DB: moover_development
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moover_development"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend Rails API
  api:
    build: 
      context: ./moover-api
      dockerfile: Dockerfile
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -b '0.0.0.0'"
    volumes:
      - ./moover-api:/app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      RAILS_ENV: ${RAILS_ENV}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Frontend Next.js
  frontend:
    build: 
      context: ./moover-frontend
      dockerfile: Dockerfile
    volumes:
      - ./moover-frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      WATCHPACK_POLLING: true
      CHOKIDAR_USEPOLLING: true
    command: npm run dev -- --hostname 0.0.0.0

volumes:
  pgdata:
